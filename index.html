<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141d45">
<title>Block Blast Solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Block Blast Solver</h1>
    <p>Marca os blocos do tabuleiro (podes arrastar), escolhe as 3 peças e a melhor jogada aparece logo.</p>
  </header>

  <section id="vision">
    <div class="vbtns">
      <button id="share" class="primary">Compartilhar tela (ao vivo)</button>
      <label class="filebtn">Enviar print<input id="file" type="file" accept="image/*" hidden></label>
    </div>
    <canvas id="frame" width="320" height="120"></canvas>
    <div class="vbtns">
      <button id="mkBoard">1. Marcar tabuleiro</button>
      <button id="mkTray">2. Marcar peças</button>
    </div>
    <label class="rng">Brilho mínimo dos blocos <input id="th" type="range" min="80" max="230" value="150"></label>
    <label class="rng">Escala das peças <input id="sc" type="range" min="0.3" max="1" step="0.05" value="0.6"></label>
    <p id="vmsg" class="hint"></p>
  </section>

  <div id="board" aria-label="Tabuleiro 8 por 8"></div>
  <div id="result" aria-live="polite"></div>

  <div id="slots"></div>
  <div id="palette"></div>

  <div class="actions">
    <button id="apply" class="primary">Aplicar jogada</button>
    <button id="clearPieces">Limpar peças</button>
    <button id="clearBoard">Limpar tabuleiro</button>
  </div>
</main>
<script src="shapes.js"></script>
<script src="solver.js"></script>
<script src="app.js"></script>
<script src="vision.js"></script>
</body>
</html>
